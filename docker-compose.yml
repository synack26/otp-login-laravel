version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: otp-laravel-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - laravel-network

volumes:
  redis_data:
    driver: local

networks:
  laravel-network:
    driver: bridge
